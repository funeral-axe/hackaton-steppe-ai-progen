<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Онлайн-поиск — SonAr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/admin.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4 py-lg-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Онлайн-поиск</h1>
            <div class="text-secondary">Расшифровка займет некоторое время</div>
        </div>
        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
    </div>

    <div class="panel-card">
        <div class="d-flex flex-wrap justify-content-between gap-3 mb-3">
            <div><strong>Статус:</strong> <span id="statusText">{{ job.status }}</span></div>
            <div><strong>Найдено файлов:</strong> <span id="resultsCount">0</span></div>
        </div>
        <div class="progress mb-3" style="height: 28px;">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: {{ job.percent }}%">{{ job.percent }}%</div>
        </div>
        <div class="row g-3 small">
            <div class="col-md-4"><span class="text-secondary">Обработано:</span> <strong id="processed">{{ job.processed_files }}</strong> из <strong id="total">{{ job.total_files }}</strong></div>
            <div class="col-md-4"><span class="text-secondary">Успешно:</span> <strong id="successful">{{ job.successful_files }}</strong></div>
            <div class="col-md-4"><span class="text-secondary">Ошибок:</span> <strong id="failed">{{ job.failed_files }}</strong></div>
        </div>
        <hr>
        <div><span class="text-secondary">Текущий файл:</span> <strong id="currentFile">{{ job.current_file or '-' }}</strong></div>
        <div id="errorBox" class="alert alert-danger mt-3 d-none"></div>
    </div>
</div>
<script>
const jobId = {{ job_id|tojson }};
async function refreshOnlineStatus() {
    try {
        const response = await fetch(`/api/online-search/${jobId}`, {cache: "no-store"});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Ошибка получения статуса");

        document.getElementById("statusText").textContent = data.status;
        document.getElementById("processed").textContent = data.processed_files;
        document.getElementById("total").textContent = data.total_files;
        document.getElementById("successful").textContent = data.successful_files;
        document.getElementById("failed").textContent = data.failed_files;
        document.getElementById("currentFile").textContent = data.current_file || "-";
        document.getElementById("resultsCount").textContent = data.results_count;
        const bar = document.getElementById("progressBar");
        bar.style.width = `${data.percent}%`;
        bar.textContent = `${data.percent}%`;

        if (data.status === "completed" || data.status === "error") {
            window.location.href = `/online-search/results/${jobId}`;
            return;
        }
        window.setTimeout(refreshOnlineStatus, 1500);
    } catch (error) {
        const box = document.getElementById("errorBox");
        box.textContent = error.message;
        box.classList.remove("d-none");
    }
}
refreshOnlineStatus();
</script>
</body>
</html>
