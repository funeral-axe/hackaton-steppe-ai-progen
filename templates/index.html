<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск аудио | SonAr Systems</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
            background-color: #0f172a;
            padding: 20px;
        }

        /* Замедленный видео-фон */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35) contrast(0.95) blur(3px);
            will-change: transform;
        }

        /* Затемняющий слой */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.6) 100%);
            z-index: -1;
        }

        /* Главный стеклянный контейнер */
        .dashboard-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 580px;
            z-index: 1;
            position: relative;
        }

        /* Верхняя панель пользователя */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logout-btn {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        /* Заголовки */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .brand-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* Поля формы */
        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }

        /* Стилизованные переключатели (Radio Cards) */
        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .radio-card {
            position: relative;
        }

        .radio-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.25s ease;
            height: 100%;
        }

        .radio-card input[type="radio"]:checked + .radio-label {
            background: rgba(42, 82, 152, 0.4);
            border-color: #60a5fa;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }

        .radio-label:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .radio-tag {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 3px;
        }

        /* Кнопка отправки */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.9) 0%, rgba(42, 82, 152, 0.9) 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(30, 60, 114, 1) 0%, rgba(42, 82, 152, 1) 100%);
            box-shadow: 0 12px 28px rgba(42, 82, 152, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- За замедление отвечает видео + JS внизу страницы -->
    <video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
        <source src="sonar.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <div class="overlay"></div>

    <div class="dashboard-card">
        <!-- Верхний бар -->
        <div class="top-bar">
            <div class="user-info">
                <span>Оператор:</span>
                <span class="user-badge">{{ user.login }}</span>
            </div>
            <a href="/logout" class="logout-btn">Завершить сессию</a>
        </div>

        <!-- Заголовок -->
        <div class="brand-header">
            <h1 class="brand-title">SonAr Intelligence</h1>
            <p class="brand-subtitle">Система поиска аудио фрагментов</p>
        </div>

        <form action="/search" method="post">
            <!-- Переключатель режимов -->
            <div class="form-group">
                <label class="form-label">Режим сканирования</label>
                <div class="radio-grid">
                    <div class="radio-card">
                        <input type="radio" id="mode_keywords" name="search_mode" value="keywords" checked required>
                        <label for="mode_keywords" class="radio-label">
                            <span>Ключевые слова</span>
                            <span class="radio-tag">Whisper AI</span>
                        </label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" id="mode_voiceprint" name="search_mode" value="voiceprint">
                        <label for="mode_voiceprint" class="radio-label">
                            <span>Отпечаток голоса</span>
                            <span class="radio-tag">Biometric ID</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Запрос -->
            <div class="form-group">
                <label class="form-label">Поисковый запрос / ID отпечатка</label>
                <input type="text" class="input-field" name="query" placeholder="Например: 'пароль' или ID_123" required autocomplete="off">
            </div>

            <!-- Путь к директории -->
            <div class="form-group">
                <label class="form-label">Путь к массиву данных (Сервер)</label>
                <input type="text" class="input-field" name="source_folder" placeholder="/path/to/10_million_audios/" required autocomplete="off">
            </div>

            <!-- Кнопка -->
            <button type="submit" class="submit-btn">Запустить анализ</button>
        </form>
    </div>

    <!-- Замедление видео до 0.4x -->
    <script>
        const video = document.getElementById('bgVideo');
        video.playbackRate = 0.4;
    </script>

</body>
</html>
