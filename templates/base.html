<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{% block title %}Панель управления{% endblock %} — SonAr</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='css/sonar-tokens.css') }}"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='css/sonar-base.css') }}"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='css/sonar-components.css') }}"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='css/sonar-layout.css') }}"
        rel="stylesheet"
    >
</head>

<body>

<div class="app-shell">

    <aside
        class="sidebar"
        id="sidebar"
    >

        <a
            class="brand"
            href="/admin"
        >

            <span class="brand-mark">
                <i class="bi bi-soundwave"></i>
            </span>

            <span>

                <span class="brand-name">
                    SonAr
                </span>

                <span class="brand-subtitle">
                    Система поиска и анализа
                </span>

            </span>

        </a>


        <div class="sidebar-section-label">
            Управление
        </div>


        <nav class="sidebar-nav">

            <a
                class="{{ 'active' if active_page == 'dashboard' else '' }}"
                href="/admin"
            >
                <i class="bi bi-grid"></i>
                Обзор
            </a>


            <a
                class="{{ 'active' if active_page == 'users' else '' }}"
                href="/admin/users"
            >
                <i class="bi bi-people"></i>
                Пользователи
            </a>


            <a
                class="{{ 'active' if active_page == 'ips' else '' }}"
                href="/admin/ips"
            >
                <i class="bi bi-shield-check"></i>
                Разрешённые IP
            </a>


            <a
                class="{{ 'active' if active_page == 'login_logs' else '' }}"
                href="/admin/login-logs"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                История входов
            </a>


            <a
                class="{{ 'active' if active_page == 'audit_logs' else '' }}"
                href="/admin/audit-logs"
            >
                <i class="bi bi-journal-text"></i>
                Журнал действий
            </a>


            <a
                class="{{ 'active' if active_page == 'sessions' else '' }}"
                href="/admin/sessions"
            >
                <i class="bi bi-display"></i>
                Активные сессии
            </a>


            <a
                class="{{ 'active' if active_page == 'settings' else '' }}"
                href="/admin/settings"
            >
                <i class="bi bi-sliders"></i>
                Настройки
            </a>

        </nav>


        <div class="sidebar-footer">

            <div class="sidebar-divider"></div>

            <a
                class="logout-link"
                href="/logout"
            >
                <i class="bi bi-box-arrow-left"></i>
                Выйти
            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div class="d-flex align-items-center gap-3">

                <button
                    class="btn btn-light d-lg-none"
                    id="sidebarToggle"
                    type="button"
                    aria-label="Открыть меню"
                >
                    <i class="bi bi-list"></i>
                </button>

                <div class="topbar-context d-none d-md-block">
                    Панель управления
                </div>

            </div>


            <div class="topbar-user">

                <div class="topbar-avatar">
                    <i class="bi bi-person"></i>
                </div>

                <div>

                    <div class="topbar-user-role">
                        Администратор
                    </div>

                    <div class="topbar-user-name">
                        {{ user.login }}
                    </div>

                </div>

            </div>

        </header>


        <section class="page-content">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    src="{{ url_for('static', path='js/admin.js') }}"
></script>

{% block scripts %}{% endblock %}

</body>
</html>
