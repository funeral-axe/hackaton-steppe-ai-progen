<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Audio Search Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/admin.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="bi bi-soundwave"></i><span>Sonar</span></div>
        <nav class="sidebar-nav">
            <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="/admin"><i class="bi bi-grid-1x2"></i>Dashboard</a>
            <a class="{{ 'active' if active_page == 'users' else '' }}" href="/admin/users"><i class="bi bi-people"></i>Пользователи</a>
            <a class="{{ 'active' if active_page == 'ips' else '' }}" href="/admin/ips"><i class="bi bi-shield-check"></i>Разрешенные IP</a>
            <a class="{{ 'active' if active_page == 'login_logs' else '' }}" href="/admin/login-logs"><i class="bi bi-box-arrow-in-right"></i>История входов</a>
            <a class="{{ 'active' if active_page == 'audit_logs' else '' }}" href="/admin/audit-logs"><i class="bi bi-journal-text"></i>Журнал действий</a>
            <a class="{{ 'active' if active_page == 'sessions' else '' }}" href="/admin/sessions"><i class="bi bi-pc-display"></i>Активные сессии</a>
            <a class="{{ 'active' if active_page == 'settings' else '' }}" href="/admin/settings"><i class="bi bi-gear"></i>Настройки</a>
        </nav>
        <a class="logout-link" href="/logout"><i class="bi bi-box-arrow-left"></i>Выйти</a>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="btn btn-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <div>
                <div class="small text-secondary">Администратор</div>
                <div class="fw-semibold">{{ user.login }}</div>
            </div>
        </header>
        <section class="page-content">
            {% block content %}{% endblock %}
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/admin.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
