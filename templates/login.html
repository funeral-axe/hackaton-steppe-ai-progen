<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | SonAr</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #2d3748;
            background-color: #0f172a;
        }

        /* Видео-фон */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.4) contrast(0.9) blur(3px);
            transition: filter 0.3s ease;
        }

        /* Затемняющий слой */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.3);
            z-index: -1;
        }

        /* Полупрозрачная карточка авторизации */
        .login-card {
    /* Непрозрачность белого снижена до 15% */
    background: rgba(255, 255, 255, 0.15); 
    /* Сильное размытие заднего плана дает эффект дорогого матового стекла */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    /* Тонкая, едва заметная светлая граница */
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 45px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 380px;
    text-align: center;
    z-index: 1;
}

        .brand-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff; /* Белый цвет для лучшего контраста на прозрачном фоне */
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            /* Полупрозрачные поля ввода */
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
        <source src="sonar.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <div class="overlay"></div>

    <div class="login-card">
        <h1 class="brand-title">SonAr</h1>
        <p class="subtitle">Вход в систему</p>

        <form action="/login" method="post">
            <div class="input-group">
                <input type="text" name="login" placeholder="Логин" autocomplete="off" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="submit-btn">Войти</button>
        </form>
    </div>

    <!-- Скрипт для замедления видео до 0.7x -->
    <script>
        const video = document.getElementById('bgVideo');
        video.playbackRate = 0.7;
    </script>

</body>
</html>
