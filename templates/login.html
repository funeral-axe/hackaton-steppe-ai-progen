<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Audio Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/admin.css') }}" rel="stylesheet">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-logo"><i class="bi bi-soundwave"></i></div>
    <h1>Audio Search</h1>
    <p class="text-secondary">Войдите в систему</p>

    {% if error %}
    <div class="alert alert-danger">
        {% if error == 'credentials' %}Неверный логин или пароль.
        {% elif error == 'blocked' %}Пользователь заблокирован.
        {% elif error == 'ip' %}Вход с этого IP запрещен.
        {% else %}Ошибка авторизации.
        {% endif %}
    </div>
    {% endif %}

    <form method="post" action="/login">
        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input class="form-control form-control-lg" name="login" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">Пароль</label>
            <input class="form-control form-control-lg" type="password" name="password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100">Войти</button>
    </form>
</div>
</body>
</html>
