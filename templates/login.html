<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | SonAr</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Прячем скроллбары */
            position: relative;
            color: #2d3748;
        }

        /* Видео-фон */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Растягивает видео без искажения пропорций */
        }

        /* Карточка авторизации */
        .login-card {
            background: rgba(255, 255, 255, 0.65); /* Полупрозрачный белый */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            z-index: 1;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            color: #1a202c;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input::placeholder {
            color: #718096;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Зацикленное видео без звука -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="sonar.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <div class="login-card">
        <h1 class="brand-title">SonAr</h1>
        <p class="subtitle">Вход в систему</p>

        <form action="/login" method="post">
            <div class="input-group">
                <input type="text" name="login" placeholder="Логин" autocomplete="off" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="submit-btn">Войти</button>
        </form>
    </div>

</body>
</html>
